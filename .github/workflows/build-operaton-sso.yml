name: Build Registration Harvester BPM with SSO
description: Builds a custom Operaton-BPM distribution with SSO support enabled, for use in downstream Docker image builds.

on:
  workflow_dispatch:
    inputs:
      operaton-version:
        description: 'Operaton Version'
        default: '2.1.1'
        options:
          - 2.1.1
          - 2.1.0
        required: true
      plugin-version:
        description: 'Keycloak Plugin Version'
        default: '2.1.0'
        options:
          - 2.1.0
          - 2.2.0-SNAPSHOT
        required: true

jobs:
  build-operaton-bpm:
    name: Build Operaton BPM Maven Package
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload-step.outputs.artifact-id }}
    permissions:
      contents: read
      checks: write
      actions: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6
      - name: Checkout original source
        run: |
          curl -L https://github.com/operaton/operaton/archive/refs/tags/v${{ inputs.operaton-version }}.tar.gz | tar -xz --strip-components=1
      - name: Swap banner
        run: |
          cat banner.txt >> distro/run/core/src/main/resources/banner.txt
      - name: Cache output
        id: cache-operaton-bpm
        uses: actions/cache@v5
        with:
          path: ~/.m2/
          key: cache-operaton-bpm-${{ hashFiles('distro/**') }}
      - name: Build maven package
        if: steps.cache-operaton-bpm.outputs.cache-hit != 'true'
        env:
          MAVEN_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          ./mvnw -pl distro/run/distro/ -am -DskipTests install
      - name: Upload single file artifact
        id: upload-step
        uses: actions/upload-artifact@v7
        with:
          #name: operaton-bpm
          path: ~/.m2/repository/org/operaton/bpm/run/operaton-bpm-run/${{ inputs.operaton-version }}/operaton-bpm-run-${{ inputs.operaton-version }}.tar.gz
          archive: false

  build-keycloak-plugin:
    name: Build Keycloak Plugin Maven Package
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload-step.outputs.artifact-id }}
    permissions:
      contents: read
      checks: write
      actions: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6
      - name: Checkout original source
        run: |
          curl -L https://github.com/operaton/operaton-keycloak/archive/refs/tags/v${{ inputs.plugin-version }}.tar.gz | tar -xz --strip-components=1
      - name: Customize
        run: |
          patch extension-run/pom.xml < extension-run/pom.xml.patch
      - name: Cache output
        id: cache-keycloak-plugin
        uses: actions/cache@v5
        with:
          path: ~/.m2/
          key: cache-keycloak-plugin-${{ hashFiles('extension-run/**') }}
      - name: Build maven package
        if: steps.cache-keycloak-plugin.outputs.cache-hit != 'true'
        env:
          MAVEN_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          ./mvnw -pl extension-run -DskipTests clean install -am
      - name: Upload artifacts
        id: upload-step
        uses: actions/upload-artifact@v7
        with:
          #name: keycloak-plugin
          path: ~/.m2/repository/org/operaton/bpm/extension/operaton-keycloak-run/${{ inputs.plugin-version }}/operaton-keycloak-run-${{ inputs.plugin-version }}.jar
          archive: false

  build-docker:
    name: Build Docker Image
    needs: [build-operaton-bpm, build-keycloak-plugin]
    runs-on: ubuntu-latest
    outputs:
      cache-docker-image-hit: ${{ steps.cache-docker-image.outputs.cache-hit }}
    #strategy:
    #  fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout original source
        run: curl -L https://github.com/operaton/operaton-docker/archive/refs/heads/main.tar.gz | tar -xz --strip-components=1
      - name: Add options --oauth2 and --webapps
        run: sed -i 's|CMD \["\./operaton\.sh"\]|CMD ["./operaton.sh", "--oauth2", "--webapps"]|' Dockerfile
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Expose GitHub Runtime
        uses: actions/github-script@v7
        with:
          script: |
            Object.keys(process.env).forEach(function (key) {
              if (key.startsWith('ACTIONS_')) {
                core.info(`${key}=${process.env[key]}`);
                core.exportVariable(key, process.env[key]);
              }
            });
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: operaton-bpm-run-${{ inputs.operaton-version }}.tar.gz
          path: .
        #/operaton-bpm
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: operaton-keycloak-run-${{ inputs.plugin-version }}.jar
          path: .
        #/keycloak-plugin
      - name: Rename file
        #run: mv ./keycloak-plugin/
        run: mv operaton-keycloak-run-${{ inputs.plugin-version }}.jar ./keycloak-plugin/operaton-keycloak-${{ inputs.plugin-version }}.jar
      - name: Cache output
        id: cache-docker-image
        uses: actions/cache@v5
        with:
          path: operaton-docker.tar
          key: cache-docker-image-${{ github.sha }}-${{ needs.build-operaton-bpm.outputs.artifact_id }}-${{ needs.build-keycloak-plugin.outputs.artifact_id }}
      - name: Build docker image
        if: steps.cache-docker-image.outputs.cache-hit != 'true'
        run: ./release-wrapper.sh
        env:
          DISTRO: run
          PLATFORMS: linux/amd64
          VERSION: ${{ inputs.operaton-version || '' }}
          SNAPSHOT: false
          IMAGE_REPO_OPERATON: operaton-docker
          ARTIFACT_ID_OPERATON: ${{ needs.build-operaton-bpm.outputs.artifact_id }}
          ARTIFACT_ID_KEYCLOAK: ${{ needs.build-keycloak-plugin.outputs.artifact_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          VERSION_KEYCLOAK: ${{ inputs.plugin-version || '' }}
      - name: Upload Docker Image as Artifact
        if: steps.cache-docker-image.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: operaton-docker.tar
          retention-days: 1
  publish-to-ghcr:
    name: Publish to Github Container Registry
    needs: build-docker
    if: needs.build-docker.outputs.cache-docker-image-hit != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Zwingend erforderlich, um auf ghcr.io zu schreiben
    steps:
      - name: Download Docker Image TAR
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Load Docker Image
        run: docker load -i operaton-docker.tar
      - name: Tag Image
        run: docker tag operaton-docker:${{ inputs.operaton-version }} ghcr.io/${{ github.repository_owner }}/operaton-docker:${{ inputs.operaton-version }}
      - name: Push Image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/operaton-docker:${{ inputs.operaton-version }}
